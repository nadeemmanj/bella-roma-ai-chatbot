<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bella Roma — AI Assistant Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a1a;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  .chat {
    width: 100%; max-width: 420px; height: 640px; max-height: 92vh;
    background: #fff; border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .header {
    background: linear-gradient(135deg, #b91c1c, #7f1d1d);
    color: #fff; padding: 16px; text-align: center;
  }
  .header h1 { font-size: 20px; }
  .header p { font-size: 12px; opacity: .85; margin-top: 4px; }
  .online { display:inline-block; width:8px; height:8px; background:#4ade80; border-radius:50%; margin-right:6px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; background: #faf7f2; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .bot { background: #fff; border: 1px solid #e7e0d5; border-bottom-left-radius: 4px; }
  .user { background: #b91c1c; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .typing { font-style: italic; opacity: .6; }
  .chips { display: flex; gap: 8px; padding: 10px 16px 0; flex-wrap: wrap; background: #faf7f2; }
  .chip {
    font-size: 12px; padding: 7px 12px; border-radius: 20px; cursor: pointer;
    border: 1px solid #b91c1c; color: #b91c1c; background: #fff;
  }
  .chip:hover { background: #b91c1c; color: #fff; }
  .inputrow { display: flex; padding: 12px 16px; background: #fff; border-top: 1px solid #eee; }
  #input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 14px; font-size: 14px; outline: none; }
  #send {
    margin-left: 8px; border: none; border-radius: 50%; width: 42px; height: 42px;
    background: #b91c1c; color: #fff; font-size: 18px; cursor: pointer;
  }
  .demo-note { text-align:center; font-size:11px; color:#999; padding:8px; background:#fff; }
</style>
</head>
<body>
<div class="chat">
  <div class="header">
    <h1>🍝 Bella Roma</h1>
    <p><span class="online"></span>Roma — AI assistant (demo)</p>
  </div>
  <div id="messages"></div>
  <div class="chips">
    <div class="chip" onclick="ask('Show me the menu')">🍕 Menu</div>
    <div class="chip" onclick="ask('What are your opening hours?')">🕐 Hours</div>
    <div class="chip" onclick="ask('I want to book a table')">📅 Book a table</div>
  </div>
  <div class="inputrow">
    <input id="input" placeholder="Ask about menu, hours, booking..." onkeydown="if(event.key==='Enter')send()" />
    <button id="send" onclick="send()">➤</button>
  </div>
  <div class="demo-note">Demo agent for client pitches — fictional restaurant</div>
</div>
<script>
  const sessionId = 'demo-' + Math.random().toString(36).slice(2, 9);
  const box = document.getElementById('messages');
  const input = document.getElementById('input');

  function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    return d;
  }

  async function ask(text) { input.value = text; send(); }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg(text, 'user');
    const t = addMsg('Roma is thinking...', 'bot typing');
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await r.json();
      t.remove();
      addMsg(data.reply || ('Error: ' + data.error), 'bot');
    } catch (e) {
      t.remove();
      addMsg('Error: cannot reach server. Is it running?', 'bot');
    }
  }

  addMsg("Ciao! I'm Roma, Bella Roma's AI assistant. Ask me about our menu, opening hours — or book a table! 🍝", 'bot');
</script>
</body>
</html>
